<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dopamine Forge V3</title>

<style>

body{
margin:0;
background:#0b1020;
color:white;
font-family:Arial,sans-serif;
}

header{
background:#18203a;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.card{
background:#1a2342;
margin:10px;
padding:15px;
border-radius:16px;
}

.weapon{
font-size:100px;
text-align:center;
}

.center{
text-align:center;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

button{
height:60px;
border:none;
border-radius:12px;
background:#4f7cff;
color:white;
font-size:16px;
font-weight:bold;
}

button:active{
transform:scale(.97);
}

.bar{
height:24px;
background:#333;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
background:linear-gradient(
90deg,
#00ff66,
#aaff00
);
width:100%;
}

#popup{
position:fixed;
left:50%;
top:45%;
transform:translate(-50%,-50%);
font-size:36px;
font-weight:bold;
pointer-events:none;
opacity:0;
z-index:999;
}

.show{
animation:pop 1s;
}

@keyframes pop{

0%{
opacity:0;
transform:
translate(-50%,-50%)
scale(.5);
}

40%{
opacity:1;
transform:
translate(-50%,-50%)
scale(1.4);
}

100%{
opacity:0;
transform:
translate(-50%,-70%)
scale(1);
}

}

#log{
height:200px;
overflow:auto;
font-size:14px;
}

.weapon-card{
padding:8px;
border-radius:10px;
margin:4px 0;
background:#27325c;
}

.legendary{
border:2px solid orange;
}

.mythic{
border:2px solid violet;
}

</style>
</head>

<body>

<header>
⚔️ Dopamine Forge V3
</header>

<div class="card">

<div id="weapon"
class="weapon">
🗡️
</div>

<div class="center">

<h2>
강화 +<span id="upgrade">0</span>
</h2>

<div>
레벨 :
<span id="level">1</span>
</div>

<div>
EXP :
<span id="exp">0</span>
/
<span id="maxExp">100</span>
</div>

<br>

<div>
전투력 :
<span id="power">10</span>
</div>

<br>

<div>
💰
<span id="gold">5000</span>

|

💎
<span id="gem">50</span>
</div>

</div>

</div>

<div class="card">

⭐ 경험치

<div class="bar">

<div
id="expBar"
class="fill">
</div>

</div>

</div>

<div class="card">

🐉 월드보스

<div class="bar">

<div
id="bossBar"
class="fill">
</div>

</div>

<div style="
text-align:center;
margin-top:10px;
">

보스 단계 :
<span id="bossLevel">
1
</span>

</div>

</div>

<div class="card grid">

<button id="huntBtn">
⚔️ 사냥
</button>

<button id="upgradeBtn">
🔥 강화
</button>

<button id="questBtn">
📜 퀘스트
</button>

<button id="gachaBtn">
🎰 가챠
</button>

<button id="pvpBtn">
🏆 PVP
</button>

<button id="bossBtn">
🐉 보스
</button>

</div>

<div class="card">

<h3>
🎒 인벤토리
</h3>

<div id="inventory">

<div class="weapon-card">
🗡️ 낡은 검
(장착중)
</div>

</div>

</div>

<div class="card">

<h3>
📜 로그
</h3>

<div id="log">
게임 시작...
</div>

</div>

<div id="popup"></div>

<script>

const SAVE_KEY =
"dopamine_forge_v3";

let game = {

gold:5000,

gem:50,

level:1,

exp:0,

upgrade:0,

bossHP:100,

bossLevel:1,

combo:0,

inventory:[
{
name:"낡은 검",
icon:"🗡️",
power:10,
rarity:"Common"
}
],

equipped:0

};

try{

const saveData =
localStorage.getItem(
SAVE_KEY
);

if(saveData){

game =
JSON.parse(saveData);

}

}catch(e){}

const rarityColor = {

Common:"#cccccc",
Rare:"#55aaff",
Epic:"#aa66ff",
Legendary:"#ffaa00",
Mythic:"#ff44ff"

};

function save(){

try{

localStorage.setItem(
SAVE_KEY,
JSON.stringify(game)
);

}catch(e){}

}

function effect(
text,
color="gold"
){

const popup =
document.getElementById(
"popup"
);

popup.innerText =
text;

popup.style.color =
color;

popup.classList.remove(
"show"
);

void popup.offsetWidth;

popup.classList.add(
"show"
);

if(
navigator.vibrate
){

navigator.vibrate(
80
);

}

}

function log(
text
){

const target =
document.getElementById(
"log"
);

target.innerHTML =
"<div>" +
text +
"</div>"
+
target.innerHTML;

}

function currentWeapon(){

return game.inventory[
game.equipped
];

}

function power(){

return Math.floor(

currentWeapon().power

+

(game.level * 5)

+

(game.upgrade * 15)

);

}

function addExp(
value
){

game.exp += value;

while(

game.exp >=
game.level * 100

){

game.exp -=
game.level * 100;

game.level++;

game.gold +=
1000;

effect(
"LEVEL UP!",
"#00ff66"
);

log(
"⭐ 레벨업 "
+
game.level
);

}

}

function renderInventory(){

const target =
document.getElementById(
"inventory"
);

target.innerHTML = "";

game.inventory.forEach(

(item,index)=>{

const div =
document.createElement(
"div"
);

div.className =
"weapon-card";

if(
item.rarity
===
"Legendary"
){
div.classList.add(
"legendary"
);
}

if(
item.rarity
===
"Mythic"
){
div.classList.add(
"mythic"
);
}

div.innerHTML =

item.icon
+
" "
+
item.name

+
"<br>"

+
item.rarity

+
" | 공격력 "

+
item.power

+
(
index ===
game.equipped

?

" (장착중)"

:

""

);

div.onclick =

function(){

game.equipped =
index;

effect(
"EQUIPPED",
"#55aaff"
);

draw();

};

target.appendChild(
div
);

}

);

}

function draw(){

document
.getElementById(
"upgrade"
)
.innerText =
game.upgrade;

document
.getElementById(
"level"
)
.innerText =
game.level;

document
.getElementById(
"exp"
)
.innerText =
game.exp;

document
.getElementById(
"maxExp"
)
.innerText =
game.level
*
100;

document
.getElementById(
"power"
)
.innerText =
power();

document
.getElementById(
"gold"
)
.innerText =
Math.floor(
game.gold
);

document
.getElementById(
"gem"
)
.innerText =
game.gem;

document
.getElementById(
"weapon"
)
.innerText =

currentWeapon()
.icon;

document
.getElementById(
"expBar"
)
.style.width =

(
game.exp
/
(
game.level
*
100
)
)
*
100

+

"%";

document
.getElementById(
"bossBar"
)
.style.width =

game.bossHP

+

"%";

document
.getElementById(
"bossLevel"
)
.innerText =

game.bossLevel;

renderInventory();

save();

}

function upgradeWeapon(){

const cost =

(
game.upgrade
+
1
)

*
300;

if(
game.gold
<
cost
){

effect(
"NO GOLD",
"red"
);

return;

}

game.gold -=
cost;

const chance =

Math.max(
20,
95 -
game.upgrade
);

if(

Math.random()
*
100

<
chance

){

game.upgrade++;

game.combo++;

effect(
"SUCCESS",
"#00ff66"
);

if(
game.combo >= 3
){

effect(
game.combo
+
" COMBO!",
"#ffaa00"
);

}

}else{

game.combo = 0;

effect(
"FAIL",
"#ff4444"
);

}

draw();

}

function gacha(){

if(
game.gem < 10
){

effect(
"NO GEM",
"red"
);

return;

}

game.gem -= 10;

const r =
Math.random();

let item;

if(
r < 0.01
){

item = {

name:"창세검",
icon:"🌌",
power:800,
rarity:"Mythic"

};

}
else if(
r < 0.05
){

item = {

name:"용검",
icon:"🐉",
power:400,
rarity:"Legendary"

};

}
else if(
r < 0.20
){

item = {

name:"마검",
icon:"🔥",
power:150,
rarity:"Epic"

};

}
else if(
r < 0.50
){

item = {

name:"기사검",
icon:"⚔️",
power:60,
rarity:"Rare"

};

}
else{

item = {

name:"낡은 검",
icon:"🗡️",
power:10,
rarity:"Common"

};

}

game.inventory.push(
item
);

effect(
item.rarity,
rarityColor[
item.rarity
]
);

log(
"🎰 "
+
item.name
+
" 획득"
);

draw();

  }
  function hunt(){

const reward =
100 +
Math.floor(Math.random()*300) +
Math.floor(power()/5);

game.gold += reward;

addExp(10);

effect(
"CRIT!",
"#00ff66"
);

log(
"⚔️ 사냥 +" +
reward +
" 골드"
);

draw();

}

function quest(){

const reward =
500 +
Math.floor(Math.random()*1000);

game.gold += reward;
game.gem += 2;

addExp(25);

effect(
"QUEST CLEAR",
"#55aaff"
);

log(
"📜 퀘스트 +" +
reward +
" 골드"
);

draw();

}

function pvp(){

if(Math.random() < 0.5){

const reward =
1000 +
Math.floor(power()*2);

game.gold += reward;

effect(
"VICTORY",
"#00ff66"
);

log(
"🏆 승리 +" +
reward +
" 골드"
);

}
else{

const reward = 500;

game.gold += reward;

effect(
"DEFEAT BONUS",
"#ffaa00"
);

log(
"😅 패배 보상 +" +
reward +
" 골드"
);

}

addExp(15);

draw();

}

function bossRaid(){

const damage =
Math.max(
5,
Math.floor(power()/20)
);

game.bossHP -= damage;

effect(
"-" + damage,
"#ff4444"
);

if(game.bossHP <= 0){

const reward =
5000 *
game.bossLevel;

game.gold += reward;
game.gem += 10;

effect(
"🐉 BOSS DOWN",
"#ffaa00"
);

log(
"🐉 보스 처치!"
);

log(
"💰 +" +
reward +
" 골드"
);

game.bossLevel++;
game.bossHP = 100;

}

draw();

}

function offlineReward(){

const now =
Date.now();

const last =
localStorage.getItem(
"dopamine_last"
);

if(last){

const diff =
Math.floor(
(now-last)/1000
);

const reward =
Math.min(
50000,
diff*2
);

if(reward > 0){

game.gold += reward;

log(
"💰 오프라인 보상 +" +
reward
);

}

}

localStorage.setItem(
"dopamine_last",
now
);

}

setInterval(function(){

const reward =
50 +
Math.floor(power()/5);

game.gold += reward;

log(
"🤖 자동사냥 +" +
reward
);

draw();

},5000);

setInterval(function(){

if(Math.random()<0.02){

const reward = 10000;

game.gold += reward;

effect(
"💰 JACKPOT!",
"#ffd700"
);

log(
"🎉 잭팟 +" +
reward +
" 골드"
);

draw();

}

},10000);

document
.getElementById(
"huntBtn"
)
.addEventListener(
"click",
hunt
);

document
.getElementById(
"questBtn"
)
.addEventListener(
"click",
quest
);

document
.getElementById(
"upgradeBtn"
)
.addEventListener(
"click",
upgradeWeapon
);

document
.getElementById(
"gachaBtn"
)
.addEventListener(
"click",
gacha
);

document
.getElementById(
"pvpBtn"
)
.addEventListener(
"click",
pvp
);

document
.getElementById(
"bossBtn"
)
.addEventListener(
"click",
bossRaid
);

offlineReward();

draw();

log(
"🎮 Dopamine Forge V3 시작!"
);

</script>

</body>
</html>
